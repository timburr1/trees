name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

jobs:
  # No id-token permission here: install scripts of every dev dependency run in this job, and none of them should be able to mint a deploy token.
  build:
    name: Build
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The root lint type-checks api/ too, so its dependencies have to be installed first.
      - name: Install API
        run: npm ci
        working-directory: api

      # Gates before anything is published. `npm run build` runs `tsc -b`, so a type error fails here.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build API
        run: npm run build:api

      # Sources only: Azure installs and builds the API itself, so node_modules and dist stay out.
      - name: Stage API
        run: |
          mkdir api-deploy
          cp api/package.json api/package-lock.json api/host.json api/tsconfig.json api/tsconfig.build.json api-deploy/
          cp -r api/src api-deploy/src

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: api-deploy
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      # The deploy action needs a GitHub OIDC token in addition to the deployment secret.
      - name: Get ID token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_OCEAN_0E5FE2410 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The client is already built. With skip_app_build, app_location is uploaded as-is, so it must be the build output.
          skip_app_build: true
          app_location: 'dist'
          output_location: ''
          # Azure installs and builds the API in this job, so its two dependencies (both Microsoft packages) run install scripts next to the deploy token.
          api_location: 'api'

  close_pull_request:
    name: Close pull request
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Tear down the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_OCEAN_0E5FE2410 }}
          action: close
